<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7df">
<title>鈴の夏休みゲーム Trade-Hunter Version 0.4</title>
<style>
:root{
  --ink:#243044; --muted:#6b7890; --card:#fff;
  --orange:#ff8738; --blue:#2e7ddd; --purple:#875ed1;
  --soft:#eef4ff; --ok:#e2f7eb; --ng:#fde8e8;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#fff7df,#edf6ff);
}
button{font:inherit}
.wrap{max-width:820px;margin:auto;padding:20px 16px 44px}
.screen{display:none}.screen.active{display:block}
.brand{text-align:center;padding:8px 0 18px}
.badge{
  display:inline-block;background:#fff;border:2px solid var(--orange);
  color:#9b4a18;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:900
}
h1{font-size:clamp(31px,6vw,50px);line-height:1.15;margin:12px 0 8px}
.lead{color:var(--muted);font-weight:800}
.card{
  background:var(--card);border-radius:26px;padding:22px;
  box-shadow:0 16px 34px rgba(54,76,112,.14)
}
.menu-title{text-align:center;font-size:22px;font-weight:900;margin:0 0 5px}
.menu-sub{text-align:center;color:var(--muted);margin:0 0 18px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.menu{
  border:0;border-radius:22px;min-height:170px;padding:20px 12px;color:#fff;
  text-align:center;cursor:pointer;box-shadow:0 10px 20px rgba(36,48,68,.12)
}
.menu:active,.choice:active,.main-btn:active,.home-btn:active{transform:scale(.985)}
.export{background:linear-gradient(145deg,#ff9b55,#ff7330)}
.import{background:linear-gradient(145deg,#4b94ef,#246bc9)}
.country{background:linear-gradient(145deg,#9b79df,#7448c2)}
.icon{font-size:48px;display:block;margin-bottom:5px}
.jp{font-size:25px;font-weight:900;display:block}
.en{display:block;font-size:15px;font-weight:900;letter-spacing:.13em;margin-top:2px}
.desc{display:block;font-size:13px;line-height:1.45;margin-top:10px}
.game-top{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.home-btn{
  border:0;background:#f0f3f8;color:var(--ink);border-radius:14px;
  padding:10px 12px;font-weight:900;cursor:pointer
}
.meter{height:10px;background:#e8edf4;border-radius:999px;overflow:hidden;flex:1}
.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ffd05c)}
.score{font-weight:900;white-space:nowrap}
.mode{
  display:inline-block;border-radius:999px;padding:7px 11px;color:#fff;
  font-size:13px;font-weight:900;margin-bottom:10px
}
.mode.export{background:var(--orange)}
.mode.import{background:var(--blue)}
.mode.country{background:var(--purple)}
.question{font-size:clamp(23px,4.4vw,32px);font-weight:900;line-height:1.4;margin:4px 0 18px}
.choices{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.choice{
  border:3px solid transparent;
  border-radius:22px;
  min-height:176px;
  padding:18px 12px;
  background:linear-gradient(180deg,#f8fbff,#edf4ff);
  color:var(--ink);
  font-weight:900;
  text-align:center;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(36,48,68,.10);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;
}
.choice:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 25px rgba(36,48,68,.15);
}
.choice:active{transform:scale(.97)}
.choice-letter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;height:34px;
  border-radius:50%;
  background:#fff;
  color:var(--muted);
  font-size:15px;
  box-shadow:0 4px 10px rgba(36,48,68,.10);
}
.choice-icon{
  min-height:54px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:46px;
  line-height:1;
}
.choice-text{
  display:block;
  font-size:clamp(16px,2.4vw,20px);
  line-height:1.35;
  overflow-wrap:anywhere;
}
.choice.correct{
  background:linear-gradient(180deg,#effff4,#dff8e8);
  border-color:#32b66c;
  color:#17683f;
  animation:correctGlow .55s ease-out;
}
.choice.wrong{
  background:linear-gradient(180deg,#fff3f3,#fde3e3);
  border-color:#e75b5b;
  color:#9c3030;
  animation:wrongShake .38s ease-out;
}
@keyframes correctGlow{
  0%{transform:scale(.96);box-shadow:0 0 0 rgba(50,182,108,0)}
  45%{transform:scale(1.045);box-shadow:0 0 28px rgba(50,182,108,.52)}
  100%{transform:scale(1);box-shadow:0 10px 20px rgba(36,48,68,.10)}
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-3px)}
}
.choice.correct{background:var(--ok);color:#1d7047}
.choice.wrong{background:var(--ng);color:#9c3030}
.feedback{
  min-height:66px;margin-top:15px;padding:13px 15px;border-radius:15px;
  background:#f7f9fc;line-height:1.6;font-size:15px
}
.main-btn{
  width:100%;border:0;border-radius:17px;padding:16px;margin-top:14px;
  background:var(--orange);color:#fff;font-size:18px;font-weight:900;cursor:pointer
}
.hidden{display:none!important}
.result{text-align:center}
.result .emoji{font-size:70px}
.result h2{font-size:31px;margin:4px 0 8px}
.result p{color:var(--muted);line-height:1.7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.secondary{background:#edf1f7;color:var(--ink)}

/* Version 0.3 */
/* Version 0.4: 横並びカード型選択肢・国旗/アイコン・正誤アニメーション */
.nav-buttons{
  display:grid;
  grid-template-columns:1fr 5fr;
  gap:10px;
  margin-top:14px;
}
.nav-buttons .main-btn{margin-top:0}
.back-btn{
  border:0;border-radius:17px;padding:16px 8px;
  background:#edf1f7;color:var(--ink);
  font-size:16px;font-weight:900;cursor:pointer
}
.back-btn:disabled{opacity:.38;cursor:default}
.answer-mark{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  font-size:min(58vw,430px);
  font-weight:900;line-height:1;
  color:#ef4444;
  opacity:0;transform:scale(.3);
  text-shadow:0 8px 24px rgba(255,255,255,.95);
}
.answer-mark.show{animation:maruPop .85s ease-out both}
@keyframes maruPop{
  0%{opacity:0;transform:scale(.3) rotate(-10deg)}
  28%{opacity:1;transform:scale(1.12) rotate(3deg)}
  68%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.08)}
}

@media(max-width:650px){
  .menu-grid{grid-template-columns:1fr}
  .menu{min-height:128px}
  .icon{font-size:40px}
  .actions{grid-template-columns:1fr}
  .choices{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .choice{min-height:150px;padding:14px 7px}
  .choice-icon{font-size:38px;min-height:45px}
  .choice-text{font-size:14px}
}
@media(max-width:420px){
  .choices{grid-template-columns:1fr}
  .choice{min-height:105px}
}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="screen active">
  <div class="brand">
    <span class="badge">Project AIノオト #001</span>
    <h1>鈴の夏休みゲーム<br>Trade-Hunter</h1>
    <div class="lead">日本の輸出入を、遊びながら覚えよう！</div>
  </div>
  <div class="card">
    <p class="menu-title">どのステージに挑戦する？</p>
    <p class="menu-sub">好きなテーマを選んでスタート</p>
    <div class="menu-grid">
      <button class="menu export" data-mode="export">
        <span class="icon">🚢</span>
        <span class="jp">輸出</span>
        <span class="en">EXPORT</span>
        <span class="desc">日本から外国へ<br>何を・どこへ送る？</span>
      </button>
      <button class="menu import" data-mode="import">
        <span class="icon">📦</span>
        <span class="jp">輸入</span>
        <span class="en">IMPORT</span>
        <span class="desc">外国から日本へ<br>何を・どこから買う？</span>
      </button>
      <button class="menu country" data-mode="country">
        <span class="icon">🌏</span>
        <span class="jp">国</span>
        <span class="en">COUNTRY</span>
        <span class="desc">国ごとの貿易の特徴を<br>見分けよう</span>
      </button>
    </div>
  </div>
</section>

<section id="game" class="screen">
  <div class="brand"><span class="badge">貿易ハンター</span></div>
  <div class="card">
    <div class="game-top">
      <button id="backHome" class="home-btn">⌂ HOME</button>
      <div class="meter"><div id="bar"></div></div>
      <div id="score" class="score">0点</div>
    </div>
    <div id="modeLabel" class="mode"></div>
    <div id="question" class="question"></div>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="feedback">答えを選んでね。</div>
    <div class="nav-buttons">
      <button id="prev" class="back-btn">← 戻る</button>
      <button id="next" class="main-btn hidden">次へ →</button>
    </div>
  </div>
</section>

<section id="result" class="screen">
  <div class="brand"><span class="badge">RESULT</span></div>
  <div class="card result">
    <div class="emoji">🌏</div>
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <div class="actions">
      <button id="retry" class="main-btn">もう一度あそぶ</button>
      <button id="resultHome" class="main-btn secondary">HOMEへ戻る</button>
    </div>
  </div>
</section>

</div>
<div id="answerMark" class="answer-mark" aria-hidden="true">○</div>

<script>
const DATA = {
  export: [
    {q:"日本の自動車の輸出先、第1位はどこ？",choices:["アメリカ","中国","オーストラリア"],answer:0,exp:"正解はアメリカ。日本の自動車輸出で、とても大きな割合を占めます。"},
    {q:"日本の自動車の輸出先、第2位はどこ？",choices:["カナダ","オーストラリア","サウジアラビア"],answer:1,exp:"第2位はオーストラリア。日本車がたくさん海を渡っています。"},
    {q:"集積回路の輸出先、第1位はどこ？",choices:["中国","台湾","韓国"],answer:0,exp:"第1位は中国。台湾、香港、韓国なども上位です。"},
    {q:"半導体等製造装置の輸出先、第1位はどこ？",choices:["アメリカ","中国","台湾"],answer:1,exp:"第1位は中国。半導体を作るための装置も、日本の重要な輸出品です。"},
    {q:"鉄鋼の輸出先、第1位はどこ？",choices:["韓国","タイ","中国"],answer:0,exp:"第1位は韓国。タイ、中国も上位に入ります。"}
  ],
  import: [
    {q:"日本が原油を最も多く輸入している国はどこ？",choices:["アメリカ","サウジアラビア","オーストラリア"],answer:1,exp:"第1位はサウジアラビア。日本のエネルギーを支える重要な相手国です。"},
    {q:"液化石油ガス（LPG）の輸入先、第1位はどこ？",choices:["アメリカ","サウジアラビア","カタール"],answer:0,exp:"第1位はアメリカ。LPGは家庭や工業など、いろいろな場面で使われます。"},
    {q:"液化天然ガス（LNG）の輸入先、第1位はどこ？",choices:["ロシア","オーストラリア","マレーシア"],answer:1,exp:"第1位はオーストラリア。日本の電力や都市ガスを支えています。"},
    {q:"輸入とは、どんな貿易？",choices:["日本から外国へ売る","外国から日本へ買う","日本国内だけで売買する"],answer:1,exp:"輸入は、外国の商品や資源を日本へ入れることです。"},
    {q:"日本が多く輸入するものとして、最も近いものは？",choices:["原油や天然ガス","新幹線","日本のアニメ"],answer:0,exp:"日本は、原油や天然ガスなどのエネルギー資源を多く輸入しています。"}
  ],
  country: [
    {q:"日本の自動車が最も多く輸出される国は？",choices:["アメリカ","韓国","インド"],answer:0,exp:"アメリカです。自動車は、日本とアメリカの貿易を考える重要な品目です。"},
    {q:"日本が原油を多く輸入する国は？",choices:["サウジアラビア","カナダ","フランス"],answer:0,exp:"サウジアラビアです。日本は中東から多くの原油を輸入しています。"},
    {q:"日本が液化天然ガス（LNG）を最も多く輸入する国は？",choices:["オーストラリア","中国","ドイツ"],answer:0,exp:"オーストラリアです。資源の豊かな国として覚えましょう。"},
    {q:"日本の鉄鋼の輸出先、第1位は？",choices:["韓国","ブラジル","イギリス"],answer:0,exp:"韓国です。日本に近く、産業の結びつきも強い国です。"},
    {q:"日本の半導体等製造装置の輸出先、第1位は？",choices:["中国","エジプト","メキシコ"],answer:0,exp:"中国です。東アジアとの貿易は、日本にとってとても重要です。"}
  ]
};

const LABELS = {
  export:{jp:"輸出",en:"EXPORT"},
  import:{jp:"輸入",en:"IMPORT"},
  country:{jp:"国",en:"COUNTRY"}
};


const CHOICE_ICONS = {
  "アメリカ":"🇺🇸",
  "中国":"🇨🇳",
  "オーストラリア":"🇦🇺",
  "カナダ":"🇨🇦",
  "サウジアラビア":"🇸🇦",
  "台湾":"🇹🇼",
  "韓国":"🇰🇷",
  "タイ":"🇹🇭",
  "カタール":"🇶🇦",
  "ロシア":"🇷🇺",
  "マレーシア":"🇲🇾",
  "インド":"🇮🇳",
  "フランス":"🇫🇷",
  "ブラジル":"🇧🇷",
  "イギリス":"🇬🇧",
  "ドイツ":"🇩🇪",
  "エジプト":"🇪🇬",
  "メキシコ":"🇲🇽",
  "日本から外国へ売る":"🚢",
  "外国から日本へ買う":"📦",
  "日本国内だけで売買する":"🏠",
  "原油や天然ガス":"🛢️",
  "新幹線":"🚄",
  "日本のアニメ":"🎬"
};

function choiceIcon(text){
  return CHOICE_ICONS[text] || "🌏";
}

let mode="export", list=[], index=0, score=0, locked=false;
let answers=[];

const screens={
  home:document.getElementById("home"),
  game:document.getElementById("game"),
  result:document.getElementById("result")
};
const qEl=document.getElementById("question");
const choicesEl=document.getElementById("choices");
const feedbackEl=document.getElementById("feedback");
const nextBtn=document.getElementById("next");
const prevBtn=document.getElementById("prev");
const scoreEl=document.getElementById("score");
const bar=document.getElementById("bar");
const modeLabel=document.getElementById("modeLabel");
const answerMark=document.getElementById("answerMark");

function show(name){
  Object.values(screens).forEach(s=>s.classList.remove("active"));
  screens[name].classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

function start(selected){
  mode=selected;
  list=DATA[mode];
  index=0;
  score=0;
  answers=Array(list.length).fill(null);
  show("game");
  render();
}

function recalculateScore(){
  score=answers.reduce((total,selected,i)=>{
    return total+(selected===list[i].answer?20:0);
  },0);
}

function render(){
  const item=list[index];
  const savedAnswer=answers[index];
  locked=savedAnswer!==null;

  modeLabel.className=`mode ${mode}`;
  modeLabel.textContent=`${LABELS[mode].jp} / ${LABELS[mode].en}`;
  qEl.textContent=item.q;
  choicesEl.innerHTML="";

  item.choices.forEach((text,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.setAttribute("aria-label",`${["A","B","C"][i]} ${text}`);
    b.innerHTML=`
      <span class="choice-letter">${["A","B","C"][i]}</span>
      <span class="choice-icon" aria-hidden="true">${choiceIcon(text)}</span>
      <span class="choice-text">${text}</span>
    `;

    if(savedAnswer!==null){
      if(i===item.answer)b.classList.add("correct");
      if(i===savedAnswer && savedAnswer!==item.answer)b.classList.add("wrong");
    }

    b.onclick=()=>answer(i,b);
    choicesEl.appendChild(b);
  });

  if(savedAnswer===null){
    feedbackEl.textContent="答えを選んでね。";
    nextBtn.classList.add("hidden");
  }else if(savedAnswer===item.answer){
    feedbackEl.textContent="🎉 正解！ "+item.exp;
    nextBtn.classList.remove("hidden");
  }else{
    feedbackEl.textContent="おしい！ "+item.exp;
    nextBtn.classList.remove("hidden");
  }

  prevBtn.disabled=index===0;
  nextBtn.textContent=index===list.length-1 ? "結果を見る →" : "次へ →";
  bar.style.width=`${((index+1)/list.length)*100}%`;
  scoreEl.textContent=`${score}点`;
}

function showCorrectMark(){
  answerMark.classList.remove("show");
  void answerMark.offsetWidth;
  answerMark.classList.add("show");
}

function answer(i,button){
  if(locked)return;
  locked=true;
  answers[index]=i;
  recalculateScore();

  const item=list[index];
  const buttons=[...choicesEl.querySelectorAll(".choice")];
  buttons[item.answer].classList.add("correct");

  if(i===item.answer){
    feedbackEl.textContent="🎉 正解！ "+item.exp;
    showCorrectMark();
  }else{
    button.classList.add("wrong");
    feedbackEl.textContent="おしい！ "+item.exp;
  }

  scoreEl.textContent=`${score}点`;
  nextBtn.classList.remove("hidden");
}

function finish(){
  bar.style.width="100%";
  show("result");
  const title=score===100?"伝説の貿易ハンター！":score>=80?"世界商人級！":score>=60?"ナイスハント！":"もう一度で強くなる！";
  document.getElementById("resultTitle").textContent=title;
  document.getElementById("resultText").textContent=
    `${LABELS[mode].jp} / ${LABELS[mode].en} ステージは ${score}点。まちがえた問題をもう一度やると、記憶が強くなるよ。`;
}

document.querySelectorAll(".menu").forEach(btn=>{
  btn.addEventListener("click",()=>start(btn.dataset.mode));
});

prevBtn.onclick=()=>{
  if(index>0){
    index--;
    render();
  }
};

nextBtn.onclick=()=>{
  if(index<list.length-1){
    index++;
    render();
  }else{
    finish();
  }
};

document.getElementById("backHome").onclick=()=>show("home");
document.getElementById("resultHome").onclick=()=>show("home");
document.getElementById("retry").onclick=()=>start(mode);

</script>
</body>
</html>
